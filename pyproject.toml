[build-system]
requires = ["scikit-build-core >= 0.10", "numpy >= 2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "sparsediffpy"
version = "0.6.1"
description = "Python bindings for SparseDiffEngine algorithmic differentiation"
requires-python = ">=3.11"
dependencies = ["numpy >= 2.0.0"]
license = "Apache-2.0"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.scikit-build]
cmake.version = ">=3.15"
wheel.packages = ["sparsediffpy"]
# Persistent build dir: avoids scikit-build-core's TemporaryDirectory, whose cleanup
# intermittently fails on Windows CI with WinError 32 (lingering mspdbsrv/AV handle).
build-dir = "build/{wheel_tag}"
