[build-system]
requires = ["scikit-build-core >= 0.10", "numpy >= 2.0.0"]
build-backend = "scikit_build_core.build"

[project]
name = "sparsediffpy"
version = "0.7.0"
description = "Python bindings for SparseDiffEngine algorithmic differentiation"
requires-python = ">=3.11"
dependencies = ["numpy >= 2.0.0"]
license = "Apache-2.0"

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.scikit-build]
# CMake 3.30 is the first whose FindPython3 understands the free-threaded ("t")
# ABI, and scikit-build-core only sends the Python3_FIND_ABI hint when this
# specifier admits 3.30+. 3.30.3 adds the Python3_DEFINITIONS a Windows
# free-threaded build needs to link python3XXt.lib.
cmake.version = ">=3.30.3"
cmake.build-type = "Release"
wheel.packages = ["sparsediffpy"]
# Persistent build dir: avoids scikit-build-core's TemporaryDirectory, whose cleanup
# intermittently fails on Windows CI with WinError 32 (lingering mspdbsrv/AV handle).
build-dir = "build/{wheel_tag}"
