# Subset of conda-forge's global pinning (conda-forge-pinning-feedstock
# recipe/conda_build_config.yaml), which rattler-build can't load directly.
# Only the oldest and newest supported Pythons are built.
c_compiler:
  - if: linux
    then: gcc
  - if: osx
    then: clang
  - if: win
    then: vs2022
c_compiler_version:
  - if: linux
    then: "15"
  - if: osx
    then: "21"
c_stdlib:
  - if: linux
    then: sysroot
  - if: osx
    then: macosx_deployment_target
  - if: win
    then: vs
c_stdlib_version:
  - if: linux
    then: "2.17"
  - if: osx
    then: "11.0"
python:
  - 3.11.* *_cpython
  - 3.14.* *_cp314
# conda-forge builds against netlib so packages link the switchable
# libblas.so.3/libcblas.so.3
libblas:
  - 3.9.* *netlib
libcblas:
  - 3.9.* *netlib
